[project]
name = "b24-mcp"
version = "0.1.0"
description = "Локальный MCP-сервер к Битрикс24: свежие данные портала для AI-агента, только чтение"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
b24-mcp = "b24_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/b24_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
